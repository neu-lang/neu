[workspace]
members = ["crates/compiler", "crates/neu"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/neu-lang/neu"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

# cranelift-object 0.133.1 has no COFF (Windows) relocation for AArch64 page
# references, so any Windows arm64 object that touches data fails to emit.
# The local copy adds those two relocations. See third_party/README.md.
[patch.crates-io]
cranelift-object = { path = "third_party/cranelift-object" }
